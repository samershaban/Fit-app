spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_STRING}
spring.datasource.username=${DB_USER}
#c63c3ez1b5bn1vhv, root, admin
spring.datasource.password=${DB_PW}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.data.rest.base-path=/api

# put in env variable, private info
okta.oauth2.client-id=${OKTA_CLIENT-ID}
    #${OKTA_CLIENT-ID}
okta.oauth2.issuer=${OKTA_ISSUER}/
okta.oauth2.client-secret=${OKTA_SECRET}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER}/
#spring.security.oauth2.resourceserver.jwt.audiences=${OKTA_ISSUER}/api/v2/
spring.security.oauth2.resourceserver.jwt.audiences=${OKTA_AUDIENCE}
# properties
Spring.main.banner-mode=off
Logging.level.root=warn